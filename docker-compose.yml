services:
  # ============================================================================
  # Application Service (PHP 8.3-FPM Backend)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drivesphere-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
      - app_build:/var/www/html/public/build
    env_file:
      - .env
    networks:
      - drivesphere-network
    depends_on:
      db:
        condition: service_healthy

  # ============================================================================
  # Web Server (Nginx Reverse Proxy & Static Asset Server)
  # ============================================================================
  web:
    image: nginx:1.27-alpine
    container_name: drivesphere-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - app_build:/var/www/html/public/build:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - drivesphere-network
    depends_on:
      - app

  # ============================================================================
  # Database Service (MySQL 8.0)
  # ============================================================================
  db:
    image: mysql:8.0
    container_name: drivesphere-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-carrental_erp}
      MYSQL_USER: ${DB_USERNAME:-drivesphere}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - drivesphere-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ============================================================================
  # Queue Worker Service (Processes Asynchronous Jobs / Emails / Duty Slips)
  # ============================================================================
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drivesphere-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
    env_file:
      - .env
    networks:
      - drivesphere-network
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy

  # ============================================================================
  # Scheduler Service (Runs Laravel Cron Jobs / Maintenance Alerts)
  # ============================================================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drivesphere-scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
    env_file:
      - .env
    networks:
      - drivesphere-network
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy

# ==============================================================================
# Persistent Named Volumes & Bridge Network
# ==============================================================================
volumes:
  db_data:
    driver: local
  app_vendor:
    driver: local
  app_build:
    driver: local

networks:
  drivesphere-network:
    driver: bridge
